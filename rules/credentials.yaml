rules:
  - id: cred_ssh_key_read
    title: "SSH private key file access"
    description: "Reading SSH private keys can expose authentication credentials."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
      - "*.rb"
    patterns:
      - "~/.ssh/id_(rsa|dsa|ecdsa|ed25519)"
      - "\\.ssh/id_(rsa|dsa|ecdsa|ed25519)"
      - "open.*\\.ssh.*id_"
      - "read.*\\.ssh.*private"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, key]

  - id: cred_aws_credentials
    title: "AWS credentials file access"
    description: "Reading AWS credential files exposes cloud access keys."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
      - "*.rb"
    patterns:
      - "~/.aws/credentials"
      - "\\.aws/credentials"
      - "~/.aws/config"
      - "\\.aws/config"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, secret]

  - id: cred_env_file
    title: ".env file access"
    description: "Reading .env files can expose API keys, database passwords, and other secrets."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
    patterns:
      - "open\\s*\\(['\"][^'\"]{0,50}\\.env['\"]"
      - "readFile[^)]{0,100}\\.env['\"]"
      - "fs\\.read[^)]{0,100}\\.env['\"]"
      - "cat\\s+[^\\n]{0,50}\\.env\\b"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, secret]

  - id: cred_kubeconfig
    title: "Kubernetes config file access"
    description: "Reading kubeconfig exposes credentials for Kubernetes cluster access."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
    patterns:
      - "~/.kube/config"
      - "\\.kube/config"
      - "KUBECONFIG"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, config]

  - id: cred_gcloud_creds
    title: "Google Cloud credentials access"
    description: "Reading gcloud credentials exposes Google Cloud authentication tokens."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
    patterns:
      - "~/.config/gcloud"
      - "\\.config/gcloud/credentials"
      - "application_default_credentials\\.json"
      - "GOOGLE_APPLICATION_CREDENTIALS"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, secret]

  - id: cred_macos_keychain
    title: "macOS Keychain access"
    description: "Accessing the macOS Keychain can expose stored passwords and certificates."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.sh"
      - "*.bash"
      - "*.rb"
    patterns:
      - "security\\s+find-(generic|internet)-password"
      - "security\\s+find-key"
      - "Keychain\\.open"
      - "SecKeychainFind"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, secret, key]

  - id: cred_browser_cookies
    title: "Browser cookie/credential storage access"
    description: "Reading browser storage can expose session cookies and saved passwords."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
    patterns:
      - "Library/Application Support/Google/Chrome"
      - "Library/Application Support/Firefox"
      - "\\.config/google-chrome"
      - "AppData/Roaming/Mozilla/Firefox"
      - "AppData/Local/Google/Chrome"
      - "Login Data"
      - "Cookies['\"]"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential, secret]

  - id: cred_git_credentials
    title: "git credentials file access"
    description: "Reading ~/.git-credentials exposes stored git authentication tokens."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.sh"
      - "*.bash"
    patterns:
      - "~/.git-credentials"
      - "\\.git-credentials"
      - "git\\s+credential"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential]

  - id: cred_npm_token
    title: ".npmrc token access"
    description: "Reading .npmrc can expose npm authentication tokens."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
    patterns:
      - "~/.npmrc"
      - "\\.npmrc"
      - "_authToken"
      - "npm_token"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential]

  - id: cred_docker_config
    title: "Docker config.json access"
    description: "Reading ~/.docker/config.json exposes Docker registry credentials."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
    patterns:
      - "~/.docker/config\\.json"
      - "\\.docker/config\\.json"
      - "docker\\s+login.*--password"
    execution_surface: [runtime]
    capabilities: [filesystem]
    asset_reach: [credential]

  - id: cred_github_token
    title: "GitHub token access"
    description: "Accessing GitHub tokens can allow unauthorized repository access."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.sh"
      - "*.bash"
      - "*.yaml"
      - "*.yml"
    patterns:
      - "GITHUB_TOKEN"
      - "GH_TOKEN"
      - "gh\\s+auth\\s+token"
      - "github\\.com/login/oauth"
    execution_surface: [runtime]
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_stripe_key
    title: "Stripe API key pattern"
    description: "Hardcoded Stripe API keys can expose payment processing credentials."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.rb"
    patterns:
      - "sk_live_[A-Za-z0-9]{20,}"
      - "pk_live_[A-Za-z0-9]{20,}"
      - "rk_live_[A-Za-z0-9]{20,}"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_openai_key
    title: "OpenAI API key pattern"
    description: "Hardcoded OpenAI API keys can lead to unauthorized API usage and billing fraud."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.env"
    patterns:
      - "sk-[A-Za-z0-9]{20,}"
      - "OPENAI_API_KEY[^\\n]{0,50}=\\s*['\"]sk-"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_anthropic_key
    title: "Anthropic API key pattern"
    description: "Hardcoded Anthropic API keys can lead to unauthorized API usage."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.env"
    patterns:
      - "sk-ant-[A-Za-z0-9\\-]{20,}"
      - "ANTHROPIC_API_KEY[^\\n]{0,50}=\\s*['\"]sk-ant-"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_private_key_pem
    title: "PEM private key in source"
    description: "Hardcoded PEM private keys expose cryptographic credentials."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.pem"
      - "*.key"
      - "*.txt"
    patterns:
      - "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
      - "-----BEGIN CERTIFICATE-----"
    execution_surface: []
    capabilities: []
    asset_reach: [key, credential]

  - id: cred_password_variable
    title: "Password variable with hardcoded value"
    description: "Variables named password/passwd/pwd with inline string values indicate hardcoded credentials."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.rb"
      - "*.sh"
    patterns:
      - "(password|passwd|pwd)\\s*=\\s*['\"][^'\"]{4,}['\"]"
      - "(PASSWORD|PASSWD|PWD)\\s*=\\s*['\"][^'\"]{4,}['\"]"
      - "(password|passwd|pwd):\\s*['\"][^'\"]{4,}['\"]"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_gcp_service_account
    title: "GCP service account JSON"
    description: "GCP service account JSON files contain credentials for Google Cloud access."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.json"
      - "*.py"
      - "*.js"
    patterns:
      - "\"type\":\\s*\"service_account\""
      - "\"private_key_id\""
      - "\"client_email\":[^\\n]{0,200}\\.iam\\.gserviceaccount\\.com"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_azure_credentials
    title: "Azure credentials or connection strings"
    description: "Azure connection strings and credentials can expose cloud resource access."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    patterns:
      - "DefaultEndpointsProtocol=https;AccountName="
      - "AZURE_CLIENT_SECRET"
      - "AZURE_SUBSCRIPTION_ID"
      - "AccountKey=[A-Za-z0-9+/=]{20,}"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_database_url
    title: "DATABASE_URL with embedded credentials"
    description: "Database URLs with embedded username/password expose database credentials."
    category: credentials
    severity: CRITICAL
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.yaml"
      - "*.yml"
      - "*.env"
    patterns:
      - "DATABASE_URL[^\\n]{0,50}=\\s*['\"]?(postgres|mysql|mongodb|redis)://[^:@]+:[^@]+@"
      - "(postgres|mysql|mongodb|redis)://[^:@]+:[^@]+@[a-zA-Z0-9\\-\\.:]+"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]

  - id: cred_slack_token
    title: "Slack bot/user token"
    description: "Hardcoded Slack tokens can allow unauthorized access to Slack workspaces."
    category: credentials
    severity: HIGH
    file_patterns:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.yaml"
      - "*.yml"
    patterns:
      - "xoxb-[0-9A-Za-z\\-]{20,}"
      - "xoxp-[0-9A-Za-z\\-]{20,}"
      - "xoxa-[0-9A-Za-z\\-]{20,}"
      - "SLACK_TOKEN[^\\n]{0,50}=\\s*['\"]xox"
    execution_surface: []
    capabilities: []
    asset_reach: [credential, secret]
